<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Vegetable Orders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: one working column (max 760px), sticky header + sticky action bar; tables over cards */
:root{
  --paper:#FFFFFF; --sheet:#F6F5F3; --ink:#141414; --ink-2:#5E5B57; --ink-3:#8E8A85;
  --line:#E6E3DF; --line-strong:#141414; --red:#C8102E; --red-ink:#FFFFFF; --red-soft:#FBE9EC;
  --ok:#1F7A45; --ok-soft:#E6F3EB; --warn:#9A6200; --warn-soft:#FBF1DE;
  --display:"Alexandria","Inter","IBM Plex Sans Arabic",sans-serif;
  --body:"Inter","IBM Plex Sans Arabic","Segoe UI",sans-serif;
  --r:6px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#131313; --sheet:#1C1B1A; --ink:#F3F1EE; --ink-2:#B3AEA8; --ink-3:#827D77;
  --line:#2C2A28; --line-strong:#F3F1EE; --red:#E5354F; --red-ink:#FFFFFF; --red-soft:#3A1A20;
  --ok:#5BC489; --ok-soft:#173023; --warn:#E5B04F; --warn-soft:#33270F; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#131313; --sheet:#1C1B1A; --ink:#F3F1EE; --ink-2:#B3AEA8; --ink-3:#827D77;
  --line:#2C2A28; --line-strong:#F3F1EE; --red:#E5354F; --red-ink:#FFFFFF; --red-soft:#3A1A20;
  --ok:#5BC489; --ok-soft:#173023; --warn:#E5B04F; --warn-soft:#33270F; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.6 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:30}
.wrap{max-width:760px;margin:0 auto;padding-block:0 140px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:0}
h1{font-size:28px;font-weight:800;line-height:1.2}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3);font-size:13px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r);
  border:1.5px solid var(--line-strong);background:transparent;font-weight:600;font-size:15px;white-space:nowrap}
.btn:hover{background:var(--sheet)}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.btn.primary:hover{filter:brightness(.94)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.ghost{border-color:var(--line)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px}
.btn.block{width:100%}
.btn svg{width:17px;height:17px;flex:none}
.btn[aria-busy="true"]{opacity:.6;pointer-events:none}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.input{height:46px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--paper);padding:0 12px;width:100%;min-width:0}
.input:focus{border-color:var(--ink);outline:none}
textarea.input{height:auto;min-height:70px;padding:10px 12px;resize:vertical}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:2px solid var(--line-strong);
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{display:flex;flex-direction:column;line-height:1.15}
.brand b{font-family:var(--display);font-weight:800;font-size:19px}
.brand span{font-size:12px;color:var(--ink-2)}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--red);color:var(--red-ink);font-size:12px;font-weight:600;padding:3px 9px;border-radius:4px}
.iconbtn{width:38px;height:38px;border-radius:var(--r);border:1.5px solid var(--line);background:transparent;display:inline-flex;align-items:center;justify-content:center}
.iconbtn svg{width:18px;height:18px}
.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--line);margin-top:14px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--ink-2);border-bottom:3px solid transparent;margin-bottom:-1.5px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red)}

/* login */
.login{min-height:100svh;display:grid;align-content:center;gap:28px;max-width:420px;margin:0 auto;padding-block:40px}
.mark{display:flex;flex-direction:column;gap:6px}
.mark .logo{display:block;width:100%;max-width:340px;height:auto;margin-bottom:10px}
.pp .ph .l .plogo{display:block;height:64px;width:auto;margin-bottom:8px}
.mark .rule{height:4px;width:56px;background:var(--red)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--line-strong);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:transparent;padding:11px 4px;font-weight:600}
.seg button+button{border-inline-start:1.5px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.err{color:var(--red);font-size:13px;min-height:20px}

/* order sheet */
.datebar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px;flex-wrap:wrap}
.datebar .d{display:flex;flex-direction:column}
.datebar .d b{font-family:var(--display);font-size:20px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:4px 10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);background:var(--paper);z-index:10}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.search{position:relative;margin-bottom:6px}
.search input{padding-inline-start:38px}
.search svg{position:absolute;inset-inline-start:12px;top:14px;width:18px;height:18px;color:var(--ink-3)}
.cat{font-family:var(--display);font-weight:700;font-size:13px;color:var(--red);padding:18px 0 0}
.row{display:grid;grid-template-columns:minmax(0,1fr) 96px auto;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line)}
.row:nth-child(even of .row){background:var(--sheet)}
.rh{display:grid;grid-template-columns:minmax(0,1fr) 96px 136px;gap:12px;padding:10px 12px;background:var(--ink);color:var(--paper);font-size:13px;font-weight:600;margin-top:8px}
.rh .q{text-align:center}
.row .ar{direction:rtl;text-align:right;font-family:"IBM Plex Sans Arabic",sans-serif;color:var(--ink-2);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ut{font-size:14px;color:var(--ink-2)}
@media (max-width:560px){.row,.rh{grid-template-columns:minmax(0,1fr) 64px auto;gap:8px;padding-inline:8px}.rh{grid-template-columns:minmax(0,1fr) 64px 128px}}
.nm-ar{display:none;direction:rtl;text-align:left;font-size:12px;color:var(--ink-3);font-family:"IBM Plex Sans Arabic",sans-serif}
.row.on .nm{font-weight:700}
.row.on,.row.on:nth-child(even of .row){background:var(--red-soft)}
.nm{font-size:16px} .un{font-size:12px;color:var(--ink-3)}
.step{display:flex;align-items:center;gap:4px}
.step button{width:40px;height:40px;border-radius:var(--r);border:1.5px solid var(--line);background:transparent;font-size:20px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.step button.plus{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.step input{width:56px;height:40px;text-align:center;border:1.5px solid transparent;border-radius:var(--r);background:transparent;font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.step input::placeholder{color:var(--ink-3);font-weight:400}
.step input:focus{border-color:var(--ink);outline:none}
.row.on .step input{color:var(--red)}
.bar{position:fixed;inset:auto 0 0;z-index:25;background:var(--paper);border-top:2px solid var(--line-strong);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;justify-content:space-between}
.bar .count{display:flex;flex-direction:column;line-height:1.2}
.bar .count b{font-family:var(--display);font-size:24px}
.empty{padding:40px 0;text-align:center;color:var(--ink-2)}

/* sheet / modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:640px;max-height:88svh;overflow:auto;border-radius:14px 14px 0 0;
  padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:14px}}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:start;font-size:12px;color:var(--ink-2);font-weight:600;border-bottom:2px solid var(--line-strong);padding:6px 4px}
table.t td{border-bottom:1px solid var(--line);padding:8px 4px;vertical-align:middle}
table.t td.q{text-align:end;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto}

/* history & supplier */
.card{border:1.5px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.card.new{border-color:var(--line-strong)}
.card .h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.new{background:var(--red-soft);color:var(--red)}
.pill.received{background:var(--warn-soft);color:var(--warn)}
.pill.delivered{background:var(--ok-soft);color:var(--ok)}
.pill.cancelled{background:var(--sheet);color:var(--ink-3)}
.pill.archived{background:var(--sheet);color:var(--ink-2)}
.pill.archived::before{border-radius:1px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.list{display:flex;flex-direction:column;gap:10px;padding-block:12px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1.5px solid var(--line-strong);border-radius:var(--r);margin-block:4px 14px}
.stats div{padding:10px 12px;display:flex;flex-direction:column}
.stats div+div{border-inline-start:1.5px solid var(--line-strong)}
.stats b{font-family:var(--display);font-size:24px;line-height:1.2}
.stats span{font-size:12px;color:var(--ink-2)}
.missing{display:flex;flex-wrap:wrap;gap:6px}
.missing span{font-size:12px;border:1px dashed var(--ink-3);border-radius:4px;padding:2px 8px;color:var(--ink-2)}
.dnav{display:flex;align-items:center;gap:6px}
.section{padding-block:18px;display:flex;flex-direction:column;gap:12px}
.section+.section{border-top:1.5px solid var(--line)}
.ed{display:grid;grid-template-columns:minmax(0,1fr) 110px 130px 40px;gap:6px;align-items:center}
.ed .input{height:40px;padding:0 8px}
.ed button{height:40px}
@media (max-width:560px){.ed{grid-template-columns:minmax(0,1fr) 96px 40px}.ed .catsel{display:none}.ed{padding-bottom:8px;border-bottom:1px solid var(--line)}}
.pins{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding-block:18px}
.filters .fx{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filters input[type=date]{direction:ltr;text-align:left}
@media (max-width:640px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}}
table.rt tbody tr{cursor:pointer}
table.rt tbody tr:hover td{background:var(--sheet)}
table.rt td{white-space:nowrap}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--ink-2);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:4px;align-self:center}
.linkbtn:hover{color:var(--red)}
.code{font-family:var(--display);font-size:22px;letter-spacing:.12em;direction:ltr;text-align:center;border:2px dashed var(--line-strong);border-radius:var(--r);padding:12px;user-select:all}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tile{border:1.5px solid var(--line-strong);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;background:var(--paper);transition:background .2s}
.tile:hover{background:var(--sheet)}
.tile .th{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tile .tq{font-size:14px;color:var(--ink-2)} .tile .tq b{font-family:var(--display);font-size:22px;color:var(--ink);margin-inline-end:4px}
.tile .tu{display:block;font-size:13px;color:var(--ink)}
.tile .tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbtn{margin-top:auto;min-height:48px;border:0;border-radius:var(--r);background:var(--red);color:var(--red-ink);font-weight:700;font-size:16px;font-family:var(--display)}
.tbtn:hover{filter:brightness(.94)}
.tile.received,.tile.delivered{border-color:var(--ok);background:var(--ok-soft)}
.tile.received:hover,.tile.delivered:hover{background:var(--ok-soft);filter:brightness(.98)}
.tstamp{margin-top:auto;display:flex;flex-direction:column;color:var(--ok);line-height:1.4}
.tstamp b{font-family:var(--display);font-size:15px}.tstamp span{font-size:13px}
.tile.none{border-style:dashed;border-color:var(--line);cursor:default;color:var(--ink-3)}
.tile.none:hover{background:var(--paper)} .tile.none h3{color:var(--ink-3)}
.stamps{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:8px}
.stamp{display:flex;justify-content:space-between;gap:8px;color:var(--ok);font-size:13px;flex-wrap:wrap}
.log{margin:6px 0 0;padding-inline-start:18px;font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:2px}
.toast{position:fixed;inset-inline:0;bottom:calc(96px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:60;pointer-events:none}
.toast div{background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:var(--r);font-weight:600;font-size:14px;max-width:90vw}
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:12px 0}
.check{width:64px;height:64px;border-radius:50%;background:var(--red);color:var(--red-ink);display:flex;align-items:center;justify-content:center}
.check svg{width:32px;height:32px}

/* pdf page (always light, rendered off-screen) */
#pdfHost{position:fixed;left:-10000px;top:0;width:794px;pointer-events:none}
.pp{width:794px;min-height:1120px;background:#fff;color:#141414;padding:48px 52px;font-family:var(--body);direction:ltr;position:relative}
.pp .ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #141414;padding-bottom:14px}
.pp .ph .l b{font-family:var(--display);font-size:26px;font-weight:800;display:block;line-height:1.2}
.pp .ph .l span{font-size:13px;color:#5E5B57}
.pp .po{text-align:right;direction:ltr}
.pp .po b{display:block;font-family:var(--display);font-size:13px;letter-spacing:.08em;color:#C8102E}
.pp .po span{font-family:var(--display);font-size:24px;font-weight:700}
.pp .meta{display:grid;grid-template-columns:repeat(3,1fr);margin:18px 0;border:1.5px solid #141414}
.pp .meta div{padding:10px 12px;display:flex;flex-direction:column}
.pp .meta div+div{border-left:1.5px solid #141414}
.pp .meta span{font-size:11px;color:#5E5B57}
.pp .meta b{font-size:16px}
.pp table{width:100%;border-collapse:collapse;font-size:15px}
.pp th{background:#141414;color:#fff;font-weight:600;text-align:left;padding:8px 10px;font-size:13px}
.pp td{padding:9px 10px;border-bottom:1px solid #E6E3DF}
.pp tr:nth-child(even) td{background:#F6F5F3}
.pp td.c{text-align:center;width:60px;color:#8E8A85}
.pp td.q{text-align:center;font-weight:700;width:90px;font-variant-numeric:tabular-nums}
.pp td.u{width:80px;color:#5E5B57}
.pp td.k{width:80px}
.pp td.en{font-weight:600;letter-spacing:.02em}
.pp td.ar{direction:rtl;text-align:right;font-family:"IBM Plex Sans Arabic",sans-serif;color:#5E5B57;font-size:14px}
.pp .note{margin-top:16px;border:1.5px dashed #8E8A85;padding:10px 12px;font-size:14px}
.pp .rcv{margin-top:14px;font-size:14px;color:#1F7A45;border:1.5px solid #1F7A45;padding:8px 12px}
.pp .sig{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:48px;font-size:13px;color:#5E5B57}
.pp .sig div{border-top:1.5px solid #141414;padding-top:6px}
.pp .foot{position:absolute;bottom:28px;right:52px;left:52px;display:flex;justify-content:space-between;font-size:11px;color:#8E8A85;border-top:1px solid #E6E3DF;padding-top:8px}
.pp .bar5{height:6px;background:#C8102E;width:72px;margin-bottom:10px}
.archbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.seg2{display:inline-grid;grid-template-columns:repeat(2,auto)}
.seg2 button{padding:9px 16px}
.aday{padding-block:14px 6px}
.at{table-layout:fixed;min-width:640px}
.adh{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.adh h3{font-family:var(--display)}
.adh .btn{margin-inline-start:auto}
.pv{border:1.5px solid var(--line-strong);border-radius:var(--r)}
.pv table.t th,.pv table.t td{padding:8px 10px;white-space:nowrap}
.pv table.t thead th{background:var(--ink);color:var(--paper);border-bottom:0}
.pv .n{text-align:end}
.pv .tot{font-weight:700;background:var(--red-soft)}
.pv thead .tot{background:var(--red);color:var(--red-ink)}
.pv .stk{position:sticky;left:0;background:var(--paper);z-index:1;font-weight:600}
.pv thead .stk{background:var(--ink)}
.pv tbody tr:nth-child(even) td{background:var(--sheet)}
.pv tbody tr:nth-child(even) td.tot{background:var(--red-soft)}
.pv tfoot td{border-top:2px solid var(--line-strong);border-bottom:0;font-weight:700}
.iconbtn:disabled{opacity:.35;cursor:default}
.dnav select.input{padding:0 10px}
::selection{background:var(--red);color:var(--red-ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="pdfHost" aria-hidden="true"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>

function bhDate(offset=0){
  const p = new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Bahrain",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
  const d = new Date(p + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + offset);
  return d.toISOString().slice(0,10);
}
function shiftDate(iso, n){ const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function dayLabel(iso){
  const d = new Date(iso + "T12:00:00Z");
  const s = new Intl.DateTimeFormat("en-GB",{weekday:"long",day:"numeric",month:"long",timeZone:"UTC"}).format(d);
  const rel = iso === bhDate(0) ? "Today" : iso === bhDate(1) ? "Tomorrow" : iso === bhDate(-1) ? "Yesterday" : "";
  return {s, rel};
}
function stampLabel(ts){
  const d = new Date(ts), z = {timeZone:"Asia/Bahrain"};
  return new Intl.DateTimeFormat("en-GB",{...z,hour:"numeric",minute:"2-digit",hour12:true}).format(d) + " · " + new Intl.DateTimeFormat("en-GB",{...z,day:"numeric",month:"long"}).format(d);
}

async function rpc(fn, args={}){
  if (window.VEG_DEMO) return window.VEG_DEMO.rpc(fn, args);
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {method:"POST",
    headers:{"apikey":SB_KEY,"Authorization":`Bearer ${SB_KEY}`,"Content-Type":"application/json"}, body:JSON.stringify(args)});
  const t = await r.text(); let j = null; try { j = t ? JSON.parse(t) : null; } catch {}
  if (!r.ok) { const m = (j && j.message) || "connection_failed"; throw new Error(m); }
  return j;
}
function errMsg(e){
  const m = String(e && e.message || e);
  if (m.includes("unauthorized")) return "Incorrect PIN.";
  if (m.includes("empty")) return "Add a quantity for at least one item.";
  if (m.includes("pin_taken")) return "This PIN is already used by another account. Choose a different one.";
  if (m.includes("pin_short")) return "PIN too short. Branches and supplier need at least 4 digits, admin needs 6.";
  if (m.includes("pin_digits")) return "The PIN must contain digits only.";
  if (m.includes("bad_code")) return "Incorrect recovery code.";
  if (m.includes("too_many")) return "Too many attempts. Wait 15 minutes and try again.";
  if (m.includes("locked")) return "The order can't be cancelled after the supplier has received it.";
  if (m.includes("Failed to fetch") || m.includes("connection_failed")) return "No internet connection. Please try again.";
  return "Something went wrong. Please try again.";
}
function toast(msg){
  const t = document.createElement("div"); t.className = "toast"; t.innerHTML = `<div>${esc(msg)}</div>`;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}

/* ---------- state ---------- */
const S = {
  boot:null, session: ls.get("veg.session"), view:"order",
  qty:{}, note:"", delivery: bhDate(1), cat:ALL, q:"",
  history:[], date: bhDate(1), orders:[], admin:null,
  arch:{month: bhDate(0).slice(0,7), branch:"", mode:"orders", data:null, key:""}

function animateIn(sel){
  if (RM || !window.gsap) return;
  const els = document.querySelectorAll(sel); if (!els.length) return;
  gsap.from(els, {opacity:0, y:10, duration:.35, stagger:.025, ease:"power2.out", clearProps:"all"});
}

/* ---------- boot ---------- */
async function boot(){
  $("#app").innerHTML = `<div class="login"><div class="mark"><div class="rule"></div><h1>Vegetable Orders</h1><span class="muted">Loading…</span></div></div>`;
  try { S.boot = await rpc("veg_bootstrap"); }
  catch(e){ $("#app").innerHTML = `<div class="login"><div class="mark"><div class="rule"></div><h1>Vegetable Orders</h1></div><p class="err">${errMsg(e)}</p><button class="btn dark" onclick="boot()">Try again</button></div>`; return; }
  if (S.session){
    try {
      const r = await rpc("veg_login",{p_branch:S.session.branch||null,p_pin:S.session.pin});
      if (r !== S.session.role) throw 0;
    } catch { S.session = null; ls.del("veg.session"); }
  }
  if (S.session && S.session.role === "branch"){ const d = ls.get("veg.draft." + S.session.branch); if (d) { S.qty = d.qty || {}; S.note = d.note || ""; } }
  route();
}
function route(){
  if (!S.session) return renderLogin();
  if (S.view === "search" && S.session.role === "admin") { clearInterval(boardTimer); return renderSearch(); }
  if (S.view === "archive" && S.session.role !== "branch") { clearInterval(boardTimer); return renderArchive(); }
  if (S.view === "search") S.view = S.session.role === "branch" ? "order" : "board";
  if (S.session.role === "branch") return S.view === "history" ? renderHistory() : renderOrder();
  if (S.session.role === "admin" && S.view === "settings") return renderSettings();
  S.view = "board"; return renderSupplier();
}
function logout(){ S.session = null; ls.del("veg.session"); S.view = "order"; S.qty = {}; S.note=""; route(); }

/* ---------- login ---------- */

  const br = S.boot.branches;

    </div>

      <div class="field" id="bf"><label for="lb">Branch</label>
        <select class="input" id="lb"><option value="">Choose branch</option>${br.map(b=>`<option value="${b.id}">${esc(bn(b.name))}</option>`).join("")}</select></div>
      <div class="field"><label for="lp">PIN</label><input class="input num" id="lp" inputmode="numeric" autocomplete="current-password" type="password" placeholder="••••"></div>
      <div class="err" id="le" role="alert"></div>
      <button class="btn primary block" id="lgo">Sign in</button>

  </div>`;
  const last = ls.get("veg.lastBranch"); if (last) $("#lb").value = last;
  document.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
    role = b.dataset.r; document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x===b));
    $("#bf").hidden = role !== "branch"; $("#le").textContent = "";
  });
  ["lb","lp"].forEach(id => $("#"+id).addEventListener("input", () => $("#le").textContent = ""));
  $("#lforgot").onclick = () => openForgot(role, role === "branch" ? $("#lb").value : null);
  $("#lf").onsubmit = async ev => {
    ev.preventDefault();
    const pin = $("#lp").value.trim(), branch = role === "branch" ? $("#lb").value : null;
    if (role === "branch" && !branch) return $("#le").textContent = "Choose your branch first.";
    if (!pin) return $("#le").textContent = "Enter your PIN.";
    const b = $("#lgo"); b.setAttribute("aria-busy","true");
    try {
      const r = await rpc("veg_login",{p_branch:branch,p_pin:pin});
      if (!r || (role !== "branch" && r !== role)) throw new Error("unauthorized");
      S.session = {role:r, pin, branch, branchName: branch ? br.find(x=>x.id===branch).name : null};

      S.view = r === "branch" ? "order" : "board";
      if (branch){ const d = ls.get("veg.draft." + branch); S.qty = (d && d.qty) || {}; S.note = (d && d.note) || ""; }
      route();

  };
}

/* ---------- branch: order ---------- */
function header(sub, tabs){
  const s = S.session;
  return `<header class="top"><div class="brand"><b>Vegetable Orders</b><span>${esc(sub)}</span></div>
    <div style="display:flex;align-items:center;gap:8px">${s.role==="branch"?`<span class="tag">${esc(bn(s.branchName))}</span>`:s.role==="supplier"?`<span class="tag">Supplier</span>`:`<span class="tag">Admin</span>`}
    <button class="iconbtn" aria-label="Change PIN" title="Change PIN" onclick="openChangePin()">${ICON.key}</button>
    <button class="iconbtn" aria-label="Sign out" title="Sign out" onclick="logout()">${ICON.out}</button></div></header>
    ${tabs?`<nav class="tabs" role="tablist">${tabs.map(t=>`<button role="tab" aria-selected="${S.view===t[0]}" onclick="S.view='${t[0]}';route()">${t[1]}</button>`).join("")}</nav>`:""}`;
}
function tabsFor(){
  const r = S.session.role;
  if (r === "branch") return [["order","New order"],["history","My orders"]];
  if (r === "admin") return [["board","Branch orders"],["archive","Archive"],["search","Search"],["settings","Settings"]];
  return [["board","Orders"],["archive","Archive"]];
}
function saveDraft(){ if (S.session && S.session.branch) ls.set("veg.draft." + S.session.branch, {qty:S.qty, note:S.note}); }
function selectedLines(){
  return S.boot.items.filter(i => Number(S.qty[i.id]) > 0).map(i => ({name:i.name, name_en:i.name_en||"", unit:i.unit, qty:Number(S.qty[i.id])}));
}
function renderOrder(){
  const items = S.boot.items, cats = [ALL, ...CATS.filter(c => items.some(i=>i.category===c)), ...[...new Set(items.map(i=>i.category))].filter(c=>!CATS.includes(c))];
  const dl = dayLabel(S.delivery);
  $("#app").innerHTML = header("New order", tabsFor()) + `
    <div class="datebar">
      <div class="d"><span class="faint">Delivery</span><b>${dl.rel ? dl.rel + " · " : ""}${esc(dl.s)}</b></div>
      <div class="dnav"><button class="iconbtn" aria-label="Previous day" onclick="setDelivery(-1)">${ICON.left}</button>
      <button class="iconbtn" aria-label="Next day" onclick="setDelivery(1)">${ICON.right}</button>
      <button class="btn sm ghost" onclick="repeatLast()">Repeat last order</button></div>
    </div>
    <div class="search">${ICON.search}<input class="input" id="sq" type="search" placeholder="Search: TOMATO…" value="${esc(S.q)}" aria-label="Search"></div>
    <div class="chips" role="group" aria-label="Categories">${cats.map(c=>`<button class="chip" aria-pressed="${S.cat===c}" data-c="${esc(c)}">${c===ALL?"All":esc(ce(c))}</button>`).join("")}</div>
    <div id="rows"></div>
    <div class="field" style="margin-top:18px"><label for="note">Note for the supplier (optional)</label><textarea class="input" id="note" placeholder="e.g. Tomatoes should be red and ripe">${esc(S.note)}</textarea></div>
    <div class="bar"><div class="in"><div class="count"><b class="num" id="cnt">0</b><span class="faint">items in order</span></div>
      <div style="display:flex;gap:8px"><button class="btn ghost" id="clr">Clear</button><button class="btn primary" id="rev">Review &amp; send</button></div></div></div>`;
  document.querySelectorAll(".chip").forEach(b => b.onclick = () => { S.cat = b.dataset.c; document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed", x===b)); drawRows(); });
  $("#sq").oninput = e => { S.q = e.target.value.trim(); drawRows(); };
  $("#note").oninput = e => { S.note = e.target.value; saveDraft(); };
  $("#clr").onclick = () => { if (!Object.keys(S.qty).length) return; S.qty = {}; saveDraft(); drawRows(); toast("Quantities cleared"); };
  $("#rev").onclick = openReview;
  drawRows(true);
}
function setDelivery(n){
  const d = shiftDate(S.delivery, n); if (d < bhDate(0)) return toast("You can't pick a day in the past");
  S.delivery = d; renderOrder();
}
function drawRows(first){
  const items = S.boot.items.filter(i => (S.cat===ALL || i.category===S.cat) && (!S.q || i.name.includes(S.q) || (i.name_en||"").toLowerCase().includes(S.q.toLowerCase())));
  let html = "", lastCat = null;
  const RH = `<div class="rh" aria-hidden="true"><span>Item</span><span>Unit</span><span class="q">Qty</span></div>`;
  for (const i of items){
    if (S.cat===ALL && !S.q && i.category !== lastCat){ html += `<div class="cat">${esc(ce(i.category))}</div>${RH}`; lastCat = i.category; }
    else if (!html) html += RH;
    const q = S.qty[i.id] || 0;
    html += `<div class="row ${q>0?"on":""}" data-id="${i.id}"><div><div class="nm">${esc(iname(i))}</div></div><div class="ut">${esc(ue(i.unit))}</div>
      <div class="step"><button class="minus" aria-label="Decrease ${esc(iname(i))}">−</button>
      <input inputmode="decimal" class="num" aria-label="Quantity of ${esc(iname(i))}" value="${q?fmtQty(q):""}" placeholder="0">
      <button class="plus" aria-label="Increase ${esc(iname(i))}">+</button></div></div>`;
  }
  $("#rows").innerHTML = html || `<div class="empty">No item matches that name.</div>`;
  $("#rows").querySelectorAll(".row").forEach(r => {
    const id = r.dataset.id, inp = $("input", r);
    const set = v => { v = Math.max(0, Math.round(v*100)/100); if (v) S.qty[id] = v; else delete S.qty[id]; inp.value = v ? fmtQty(v) : ""; r.classList.toggle("on", v>0); saveDraft(); updCount(); };
    $(".plus", r).onclick = () => { set((Number(S.qty[id])||0) + 1); if (!RM && window.gsap) gsap.fromTo(inp,{scale:1.25},{scale:1,duration:.25,ease:"back.out(3)"}); };
    $(".minus", r).onclick = () => set((Number(S.qty[id])||0) - 1);
    inp.onchange = () => set(Number(String(inp.value).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(",", ".")) || 0);
    inp.onfocus = () => inp.select();
  });
  updCount();
  if (first) animateIn("#rows .row");
}
function updCount(){ const n = Object.keys(S.qty).filter(k => S.boot.items.some(i=>i.id===k)).length; const c = $("#cnt"); if (c) c.textContent = n; }
async function repeatLast(){
  try {
    const h = await rpc("veg_branch_orders",{p_branch:S.session.branch,p_pin:S.session.pin});
    const last = h.find(o => o.status !== "cancelled");
    if (!last) return toast("No previous order");
    S.qty = {};
    for (const l of last.items){ const it = S.boot.items.find(i => i.name === l.name || (l.name_en && i.name_en === l.name_en)); if (it) S.qty[it.id] = Number(l.qty); }
    saveDraft(); drawRows(); toast(`Copied order #${pad(last.id)}`);
  } catch(e){ toast(errMsg(e)); }
}
function modal(html){
  const m = document.createElement("div"); m.className = "scrim"; m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" data-lenis-prevent>${html}</div>`;
  m.addEventListener("click", e => { if (e.target === m) m.remove(); });
  document.body.appendChild(m);
  if (!RM && window.gsap) gsap.from($(".sheet", m), {y:40, opacity:0, duration:.3, ease:"power3.out"});
  return m;
}
function linesTable(lines){
  return `<div class="tw"><table class="t"><thead><tr><th>Item</th><th>Unit</th><th style="text-align:end">Qty</th></tr></thead><tbody>
  ${lines.map(l=>`<tr><td>${esc(l.name_en||l.name)}</td><td class="muted">${esc(ue(l.unit))}</td><td class="q">${fmtQty(l.qty)}</td></tr>`).join("")}</tbody></table></div>`;
}
function openReview(){
  const lines = selectedLines();
  if (!lines.length) return toast("Add a quantity for at least one item");
  const dl = dayLabel(S.delivery);
  const m = modal(`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>Review order</h2><span class="tag">${esc(bn(S.session.branchName))}</span></div>
    <div class="muted">Delivery: <b style="color:var(--ink)">${dl.rel?dl.rel+" · ":""}${esc(dl.s)}</b> · ${lines.length} ${lines.length===1?"item":"items"}</div>
    ${linesTable(lines)}
    ${S.note.trim()?`<div class="card"><span class="faint">Note</span>${esc(S.note)}</div>`:""}
    <div class="err" id="re" role="alert"></div>
    <div style="display:flex;gap:8px"><button class="btn ghost" id="rb">Edit</button><button class="btn primary" style="flex:1" id="rs">Send to supplier</button></div>`);
  $("#rb", m).onclick = () => m.remove();
  $("#rs", m).onclick = async () => {
    const b = $("#rs", m); b.setAttribute("aria-busy","true"); b.textContent = "Sending…";
    try {
      const o = await rpc("veg_submit_order",{p_branch:S.session.branch,p_pin:S.session.pin,p_items:lines,p_note:S.note,p_delivery:S.delivery});
      S.qty = {}; S.note = ""; saveDraft(); m.remove(); renderOrder(); showSent(o);
    } catch(e){ $("#re", m).textContent = errMsg(e); b.removeAttribute("aria-busy"); b.textContent = "Send to supplier"; }
  };
}
function showSent(o){
  const sup = S.boot.supplier || {};
  const m = modal(`<div class="done"><div class="check">${ICON.check}</div><h2>Order ${onum(o.id)} saved</h2>
    <p class="muted" style="margin:0">The order now shows on the supplier board. Send them the purchase order file on WhatsApp.</p></div>
    <button class="btn primary block" id="sw">Send PDF via WhatsApp</button>
    <button class="btn block" id="sd">Download PDF</button>
    ${sup.whatsapp?`<p class="faint" style="margin:0;text-align:center">Supplier WhatsApp: <span class="num" dir="ltr">+${esc(sup.whatsapp)}</span></p>`:`<p class="faint" style="margin:0;text-align:center">The supplier WhatsApp number hasn't been added yet. Admin can add it in Settings.</p>`}
    <button class="btn ghost block" id="sc">Done</button>`);
  if (!RM && window.gsap) gsap.from($(".check", m), {scale:0, rotate:-45, duration:.5, ease:"back.out(2)", delay:.1});
  $("#sw", m).onclick = e => sendWhatsApp([o], e.currentTarget);
  $("#sd", m).onclick = e => downloadPdf([o], e.currentTarget);
  $("#sc", m).onclick = () => m.remove();
}

/* ---------- branch: history ---------- */
async function renderHistory(){
  $("#app").innerHTML = header("My orders", tabsFor()) + `<div class="list" id="hl"><div class="empty">Loading…</div></div>`;
  try { S.history = await rpc("veg_branch_orders",{p_branch:S.session.branch,p_pin:S.session.pin}); }
  catch(e){ $("#hl").innerHTML = `<div class="empty">${errMsg(e)}</div>`; return; }
  if (!S.history.length){ $("#hl").innerHTML = `<div class="empty"><h3>No orders for this branch yet</h3><p>Your first order will appear here with its status.</p><button class="btn primary" onclick="S.view='order';route()">New order</button></div>`; return; }
  $("#hl").innerHTML = S.history.map(o => orderCard(o, "branch")).join("");
  bindCards($("#hl"), S.history, "branch");
  animateIn("#hl .card");
}
function orderCard(o, mode){
  const dl = dayLabel(o.delivery_date);
  const head = mode === "branch" ? `Order ${onum(o.id)}` : `${esc(bn(o.branch_name))}`;
  const sub = mode === "branch" ? `Delivery ${dl.rel?dl.rel+" · ":""}${esc(dl.s)}` : `${onum(o.id)} · Sent ${esc(timeLabel(o.created_at))}`;
  let acts = "";
  if (o.status !== "cancelled"){
    acts += `<button class="btn sm" data-a="pdf">PDF</button>`;
    if (mode === "branch"){ acts += `<button class="btn sm" data-a="wa">WhatsApp</button>`; if (o.status === "new") acts += `<button class="btn sm ghost" data-a="cancel">Cancel</button>`; }
    else { if (o.status === "new") acts += `<button class="btn sm primary" data-a="received">Mark received</button>`;
           if (o.status === "received") acts += `<button class="btn sm dark" data-a="delivered">Mark delivered</button>`;
           if (o.status !== "new" && !o.archived_at) acts += `<button class="btn sm ghost" data-a="new">Undo receipt</button>`;
           if (o.status !== "new") acts += o.archived_at ? `<button class="btn sm" data-a="unarchive">Move back to board</button>` : `<button class="btn sm" data-a="archive">Archive</button>`; }
  }
  return `<article class="card ${o.status==="new"?"new":""}" data-id="${o.id}">
    <div class="h"><div><h3>${head}</h3><div class="faint">${sub} · ${o.items.length} ${o.items.length===1?"item":"items"}</div></div><span style="display:flex;gap:6px;flex-wrap:wrap">${o.archived_at?`<span class="pill archived">Archived</span>`:""}<span class="pill ${o.status}">${STATUS[o.status]}</span></span></div>
    ${o.status!=="cancelled"?`<details${mode!=="branch"?" open":""}><summary class="faint" style="cursor:pointer">Items</summary>${linesTable(o.items)}</details>`:""}
    ${o.note?`<div class="faint">Note: <span style="color:var(--ink)">${esc(o.note)}</span></div>`:""}
    ${stampsHtml(o)}
    ${mode!=="branch" && o.log && o.log.length ? `<details><summary class="faint" style="cursor:pointer">Log (${o.log.length})</summary><ul class="log">${o.log.map(l=>`<li><b class="num">${esc(stampLabel(l.at))}</b> · ${esc(LOGNAME[l.action]||l.action)}${l.by?` · ${esc(ROLENAME[l.by]||l.by)}`:""}</li>`).join("")}</ul></details>` : ""}
    ${acts?`<div class="acts">${acts}</div>`:""}</article>`;
}
function bindCards(root, list, mode, onDone){
  root.querySelectorAll(".card").forEach(c => {
    const o = list.find(x => String(x.id) === c.dataset.id);
    c.querySelectorAll("[data-a]").forEach(b => b.onclick = async () => {
      const a = b.dataset.a;
      if (a === "pdf") return downloadPdf([o], b);
      if (a === "wa") return sendWhatsApp([o], b);
      if (a === "cancel"){
        if (b.dataset.sure !== "1"){ b.dataset.sure = "1"; b.textContent = "Sure? Tap to cancel"; b.classList.add("primary"); return; }
        try { await rpc("veg_cancel_order",{p_branch:S.session.branch,p_pin:S.session.pin,p_id:o.id}); toast("Order cancelled"); renderHistory(); }
        catch(e){ toast(errMsg(e)); }
        return;
      }
      if (a === "archive" || a === "unarchive"){
        b.setAttribute("aria-busy","true");
        try { await rpc("veg_set_archived",{p_pin:S.session.pin,p_ids:[o.id],p_archived:a==="archive"});
          o.archived_at = a==="archive" ? new Date().toISOString() : null;
          toast(a==="archive" ? `Order #${pad(o.id)} archived` : `Order #${pad(o.id)} is back on the board`);
          if (onDone) onDone(o); else loadBoard(true); }
        catch(e){ toast(errMsg(e)); b.removeAttribute("aria-busy"); }
        return;
      }
      if (a === "new" && b.dataset.sure !== "1"){ b.dataset.sure = "1"; b.textContent = "Sure? Tap to undo"; b.classList.add("primary"); return; }
      b.setAttribute("aria-busy","true");
      try { const r = await rpc("veg_set_status",{p_pin:S.session.pin,p_id:o.id,p_status:a});

function totals(list){

}

function monthRange(m){ const [y,mo] = m.split("-").map(Number); const last = new Date(Date.UTC(y, mo, 0)).getUTCDate(); return {from:`${m}-01`, to:`${m}-${String(last).padStart(2,"0")}`}; }
function monthLabel(m){ return new Intl.DateTimeFormat("en-GB",{month:"long",year:"numeric",timeZone:"UTC"}).format(new Date(m+"-15T12:00:00Z")); }
function shiftMonth(m, n){ const [y,mo] = m.split("-").map(Number); const d = new Date(Date.UTC(y, mo-1+n, 1)); return d.toISOString().slice(0,7); }
async function loadArchive(force){
  const A = S.arch, key = A.month + "|" + A.branch;
  if (!force && A.data && A.key === key) return A.data;
  const r = monthRange(A.month);
  A.data = await rpc("veg_orders_range",{p_pin:S.session.pin,p_from:r.from,p_to:r.to,p_branch:A.branch||null}); A.key = key;
  return A.data;
}

    </div>
    <div class="stats"><div><b class="num" id="a1">–</b><span>Archived orders</span></div><div><b class="num" id="a2">–</b><span>All orders this month</span></div><div><b class="num" id="a3">–</b><span>Branches ordered</span></div></div>
    <div class="archbar">
      <div class="seg seg2" role="group" aria-label="View"><button type="button" data-m="orders" aria-pressed="${A.mode==="orders"}">Archived orders</button><button type="button" data-m="summary" aria-pressed="${A.mode==="summary"}">Monthly summary</button></div>
      <button class="btn" id="xls">${ICON.sheet}Export Excel</button>

  $("#mprev").onclick = () => { A.month = shiftMonth(A.month,-1); renderArchive(); };

function pivot(list){
  const order = new Map(S.boot.items.map((i,ix)=>[i.name, ix]));
  const branches = S.boot.branches.filter(b => list.some(o=>o.branch_id===b.id));
  const rows = new Map();
  for (const o of list) for (const l of o.items){
    const k = l.name + "|" + l.unit;
    if (!rows.has(k)) rows.set(k, {name:l.name, name_en:l.name_en||"", unit:l.unit, by:{}, total:0});
    const r = rows.get(k); r.by[o.branch_id] = (r.by[o.branch_id]||0) + Number(l.qty); r.total += Number(l.qty);
  }
  const items = [...rows.values()].sort((a,b)=>(order.get(a.name)??999)-(order.get(b.name)??999));
  const counts = Object.fromEntries(branches.map(b=>[b.id, list.filter(o=>o.branch_id===b.id).length]));
  return {branches, items, counts};
}
function drawSummary(ac, all){
  if (!all.length){ ac.innerHTML = `<div class="empty"><h3>No orders in ${esc(monthLabel(S.arch.month))}</h3><p>Pick another month with the arrows above.</p></div>`; return; }
  const P = pivot(all);
  ac.innerHTML = `<p class="faint" style="margin:0 0 10px">Total quantity of each item per branch, for every order delivered in ${esc(monthLabel(S.arch.month))} (archived or not, cancelled orders left out).</p>
    <div class="tw pv"><table class="t"><thead><tr><th class="stk">Item</th><th>Unit</th>${P.branches.map(b=>`<th class="n">${esc(bn(b.name))}</th>`).join("")}<th class="n tot">Total</th></tr></thead><tbody>
    ${P.items.map(r=>`<tr><td class="stk">${esc(r.name_en||r.name)}</td><td class="muted">${esc(ue(r.unit))}</td>${P.branches.map(b=>`<td class="n num">${r.by[b.id]?fmtQty(r.by[b.id]):'<span class="faint">–</span>'}</td>`).join("")}<td class="n num tot">${fmtQty(r.total)}</td></tr>`).join("")}
    </tbody><tfoot><tr><td class="stk">Orders</td><td></td>${P.branches.map(b=>`<td class="n num">${P.counts[b.id]}</td>`).join("")}<td class="n num tot">${all.length}</td></tr></tfoot></table></div>`;
}
let xlsxReady = null;
function loadXlsx(){
  if (window.XLSX) return Promise.resolve();
  return xlsxReady || (xlsxReady = new Promise((ok, bad) => { const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; sc.onload = ok; sc.onerror = () => { xlsxReady = null; bad(new Error("Failed to fetch")); }; document.head.appendChild(sc); }));
}
async function exportExcel(btn){
  const t = btn.innerHTML; btn.setAttribute("aria-busy","true"); btn.textContent = "Preparing Excel…";
  try {
    const [data] = await Promise.all([loadArchive(), loadXlsx()]);
    const all = data.filter(o=>o.status!=="cancelled");
    if (!all.length){ toast("No orders this month to export"); return; }
    const d = iso => iso ? new Date(iso) : "";
    const day = s => new Date(s + "T00:00:00");
    const P = pivot(all), wb = XLSX.utils.book_new();
    const sum = [["Item","Unit",...P.branches.map(b=>bn(b.name)),"Total"],
      ...P.items.map(r=>[r.name_en||r.name, ue(r.unit), ...P.branches.map(b=>r.by[b.id]||0), r.total]),
      ["Orders","",...P.branches.map(b=>P.counts[b.id]), all.length]];
    const ws1 = XLSX.utils.aoa_to_sheet(sum); ws1["!cols"] = [{wch:22},{wch:9},...P.branches.map(()=>({wch:13})),{wch:10}];
    const lines = [["Order no.","Delivery date","Branch","Item","Unit","Qty","Status","Received at","Delivered at","Archived","Note"]];
    const sorted = [...all].sort((a,b)=>a.delivery_date.localeCompare(b.delivery_date) || a.id-b.id);
    for (const o of sorted) for (const l of o.items) lines.push([o.id, day(o.delivery_date), bn(o.branch_name), l.name_en||l.name, ue(l.unit), Number(l.qty), STATUS[o.status], d(o.received_at), d(o.delivered_at), o.archived_at?"Yes":"No", o.note||""]);
    const ws2 = XLSX.utils.aoa_to_sheet(lines, {cellDates:true, dateNF:"dd mmm yyyy"});
    ws2["!cols"] = [{wch:10},{wch:14},{wch:14},{wch:22},{wch:9},{wch:7},{wch:20},{wch:18},{wch:18},{wch:9},{wch:30}];
    const orders = [["Order no.","Delivery date","Branch","Items","Quantities","Status","Sent at","Received at","Delivered at","Archived","Note"],
      ...sorted.map(o=>[o.id, day(o.delivery_date), bn(o.branch_name), o.items.length, unitTotals(o.items), STATUS[o.status], d(o.created_at), d(o.received_at), d(o.delivered_at), o.archived_at?"Yes":"No", o.note||""])];
    const ws3 = XLSX.utils.aoa_to_sheet(orders, {cellDates:true, dateNF:"dd mmm yyyy"});
    ws3["!cols"] = [{wch:10},{wch:14},{wch:14},{wch:7},{wch:20},{wch:20},{wch:18},{wch:18},{wch:18},{wch:9},{wch:30}];
    const fmt = (ws, timeCols) => { for (const k in ws) if (ws[k] && ws[k].t === "d") ws[k].z = timeCols.includes(k.replace(/\d+$/,"")) ? "dd mmm yyyy hh:mm" : "dd mmm yyyy"; };
    fmt(ws2, ["H","I"]); fmt(ws3, ["G","H","I"]);
    XLSX.utils.book_append_sheet(wb, ws1, "Monthly summary");
    XLSX.utils.book_append_sheet(wb, ws3, "Orders");
    XLSX.utils.book_append_sheet(wb, ws2, "Order lines");
    const br = S.arch.branch ? "-" + bn((S.boot.branches.find(b=>b.id===S.arch.branch)||{}).name||"").replace(/\s+/g,"-") : "";
    XLSX.writeFile(wb, `veg-orders-${S.arch.month}${br}.xlsx`);
  } catch(e){ toast(errMsg(e)); }
  finally { btn.removeAttribute("aria-busy"); btn.innerHTML = t; }
}

function monthStart(){ return bhDate(0).slice(0,8) + "01"; }
function renderSearch(){
  const isBranch = S.session.role === "branch";

  $("#app").innerHTML = header("Search orders", tabsFor()) + `
  <form id="sf" class="filters" novalidate>
    <div class="field"><label for="fb">Branch</label>
      ${isBranch ? `<input class="input" id="fb" value="${esc(bn(S.session.branchName))}" disabled>` :
      `<select class="input" id="fb"><option value="">All branches</option>${S.boot.branches.map(b=>`<option value="${b.id}" ${F.branch===b.id?"selected":""}>${esc(bn(b.name))}</option>`).join("")}</select>`}</div>
    <div class="field"><label for="fi">Item</label>

    <div class="field"><label for="ff">Delivery from</label><input class="input num" type="date" id="ff" value="${F.from}"></div>
    <div class="field"><label for="ft">Delivery to</label><input class="input num" type="date" id="ft" value="${F.to}"></div>

    <div class="fx"><button class="btn primary" id="sgo">Search</button><button type="button" class="btn ghost" id="sclr">Clear filters</button>
      <span class="err" id="serr" role="alert"></span></div>
  </form>
  <div id="sr"></div>`;

async function runSearch(){
  const isBranch = S.session.role === "branch", F = S.f;
  if (!isBranch) F.branch = $("#fb").value;
  F.item = $("#fi").value; F.status = $("#fs").value; F.from = $("#ff").value; F.to = $("#ft").value; F.order = $("#fo").value.replace(/\D/g,"");
  if (F.from && F.to && F.from > F.to) return $("#serr").textContent = "The start date is after the end date.";
  const sr = $("#sr"); sr.innerHTML = `<div class="empty">Searching…</div>`;
  try {
    S.results = await rpc("veg_search", {p_pin:S.session.pin, p_auth_branch:isBranch?S.session.branch:null, p_branch:F.branch||null,
      p_item:F.item||null, p_from:F.from||null, p_to:F.to||null, p_status:F.status||null, p_order:F.order?Number(F.order):null});
  } catch(e){ sr.innerHTML = `<div class="empty">${errMsg(e)}</div>`; return; }
  drawResults();
}
function drawResults(){
  const R = S.results, F = S.f, sr = $("#sr");
  if (!R.length){ sr.innerHTML = `<div class="empty"><h3>No orders match these filters</h3><p>Widen the date range or choose “All items”.</p></div>`; return; }
  const live = R.filter(o => o.status !== "cancelled");
  const itemQty = o => { const l = o.items.find(x => x.name === F.item); return l ? Number(l.qty) : 0; };
  const fItem = F.item ? (S.boot.items.find(i => i.name === F.item) || {name:F.item}) : null;
  const itemUnit = fItem ? ue(fItem.unit || "") : "";
  const sumItem = F.item ? live.reduce((a,o) => a + itemQty(o), 0) : null;
  sr.innerHTML = `
    <div class="stats"><div><b class="num">${R.length}${R.length>=500?"+":""}</b><span>Orders</span></div>
      <div><b class="num">${new Set(live.map(o=>o.branch_id)).size}</b><span>Branches</span></div>
      ${F.item ? `<div><b class="num">${fmtQty(sumItem)}</b><span>${esc(iname(fItem))} (${esc(itemUnit)})</span></div>` : `<div><b class="num">${live.filter(o=>o.status==="delivered").length}</b><span>Delivered</span></div>`}</div>
    <div class="acts" style="margin-bottom:10px"><button class="btn" id="stot">Quantity totals</button>${S.session.role!=="branch"?`<button class="btn" id="spdf">PDF of results</button>`:""}</div>
    <div class="tw"><table class="t rt"><thead><tr><th>No.</th><th>Branch</th><th>Delivery</th><th>Status</th><th>Received</th><th style="text-align:end">${F.item?esc(iname(fItem)):"Items"}</th></tr></thead><tbody>
    ${R.map(o => `<tr data-id="${o.id}" tabindex="0"><td>${onum(o.id)}</td><td>${esc(bn(o.branch_name))}</td><td class="num">${esc(shortDate(o.delivery_date))}</td>
      <td><span class="pill ${o.status}">${STATUS[o.status]}</span></td><td class="num faint">${o.received_at?esc(stampLabel(o.received_at)):"—"}</td><td class="q">${F.item ? fmtQty(itemQty(o)) : o.items.length}</td></tr>`).join("")}
    </tbody></table></div>`;
  $("#stot").onclick = () => { if (!live.length) return toast("All results are cancelled");
    modal(`<h2>Quantity totals</h2><div class="muted">${live.length} ${live.length===1?"order":"orders"} · ${esc(rangeLabel())}</div>${linesTable(totals(live))}<button class="btn block" onclick="this.closest('.scrim').remove()">Close</button>`); };
  const sp = $("#spdf"); if (sp) sp.onclick = e => { if (!live.length) return toast("All results are cancelled"); downloadPdf(live, e.currentTarget, true); };
  sr.querySelectorAll("tbody tr").forEach(tr => {
    const open = () => { const o = R.find(x => String(x.id) === tr.dataset.id);
      const m = modal(orderCard(o, S.session.role === "branch" ? "branch" : "supplier").replace('<details>','<details open>') + `<button class="btn ghost block" id="mc">Close</button>`);
      $("#mc", m).onclick = () => m.remove();
      bindCards(m, [o], S.session.role === "branch" ? "branch" : "supplier");
      m.querySelectorAll("[data-a]").forEach(b => { if (!["pdf","wa"].includes(b.dataset.a)) b.addEventListener("click", () => setTimeout(() => { m.remove(); runSearch(); }, 700)); });
    };
    tr.onclick = open; tr.onkeydown = e => { if (e.key === "Enter") open(); };
  });
  if (!RM && window.gsap) gsap.from(sr.querySelectorAll("tbody tr"), {opacity:0, duration:.25, stagger:.01, clearProps:"all"});
}
function shortDate(iso){ return new Intl.DateTimeFormat("en-GB",{day:"numeric",month:"short",timeZone:"UTC"}).format(new Date(iso+"T12:00:00Z")); }
function rangeLabel(){ const F = S.f; return (F.from ? shortDate(F.from) : "Start") + " to " + (F.to ? shortDate(F.to) : "Today"); }

    <div class="sig"><div>Supplier signature</div><div>Branch receiver signature</div></div>
    <div class="foot"><span>Items: ${o.items.length}</span><span>${n>1?`Page ${i+1} of ${n}`:"Fareeq Bin Aqool"}</span></div></div>`;
}
function summaryPage(list, n){
  const t = totals(list), dl = dayLabel(list[0].delivery_date);
  return `<div class="pp" style="page-break-after:always">
    <div class="ph"><div class="l"><div class="bar5"></div><img class="plogo" src="${LOGO}" alt="Fareeq Bin Aqool"><span>Vegetable orders summary, all branches</span></div>
      <div class="po"><b>SUMMARY</b><span>${list.length} ${list.length===1?"order":"orders"}</span></div></div>
    <div class="meta"><div><span>Delivery date</span><b>${esc(dl.s)}</b></div><div><span>Branches</span><b>${new Set(list.map(o=>o.branch_id)).size}</b></div><div><span>Items</span><b>${t.length}</b></div></div>
    <table><thead><tr><th style="text-align:center">#</th><th>Item</th><th>Unit</th><th style="text-align:center">Total</th></tr></thead><tbody>
    ${t.map((l,ix)=>`<tr><td class="c">${ix+1}</td><td class="en">${esc(l.name_en||l.name)}</td><td class="u">${esc(ue(l.unit))}</td><td class="q">${fmtQty(l.qty)}</td></tr>`).join("")}</tbody></table>
    <div class="foot"><span>${list.map(o=>bn(o.branch_name)).join(" · ")}</span><span>Page 1 of ${n}</span></div></div>`;

async function makePdf(list, combined){
  const host = $("#pdfHost");
  const n = list.length + (combined ? 1 : 0);
  host.innerHTML = (combined ? summaryPage(list, n) : "") + list.map((o,i) => pdfPage(o, i + (combined?1:0), n)).join("");
  if (combined) host.querySelectorAll(".pp").forEach((p,i)=>{ const f=p.querySelector(".foot span:last-child"); if (f && i>0) f.textContent = `Page ${i+1} of ${n}`; });
  // Render from the HTML itself, not from the off-screen host: the host's off-screen
  // position was carried into the copy html2pdf captures, which produced blank pages.
  const html = host.innerHTML; host.innerHTML = "";
  try { await document.fonts.ready; } catch {}
  const blob = await html2pdf().set({margin:0, image:{type:"jpeg",quality:.95},
    html2canvas:{scale:2, useCORS:true, backgroundColor:"#ffffff", scrollX:0, scrollY:0},
    jsPDF:{unit:"px", format:[794,1123], orientation:"portrait", hotfixes:["px_scaling"]},
    pagebreak:{mode:["css"]}}).from(html, "string").outputPdf("blob");
  return blob;
}
function pdfName(list, combined){
  const d = list[0].delivery_date;
  return combined ? `veg-all-branches-${d}.pdf` : `veg-order-${bn(list[0].branch_name).replace(/\s+/g,"-")}-${pad(list[0].id)}.pdf`;
}
async function downloadPdf(list, btn, combined=false){
  if (window.VEG_DEMO) return showPdfPreview(list, combined);
  const t = btn && btn.textContent; if (btn){ btn.setAttribute("aria-busy","true"); btn.textContent = "Preparing PDF…"; }
  try {
    const blob = await makePdf(list, combined);
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = pdfName(list, combined);
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  } catch(e){ toast("Couldn't prepare the file. Please try again."); }
  if (btn){ btn.removeAttribute("aria-busy"); btn.textContent = t; }
}
function waText(o){
  const dl = dayLabel(o.delivery_date);
  return `Vegetable order · ${bn(o.branch_name)} branch\nOrder no.: #${pad(o.id)}\nDelivery: ${dl.s}\n\n` +
    o.items.map(l => `• ${l.name_en||l.name}: ${fmtQty(l.qty)} ${ue(l.unit)}`).join("\n") + (o.note ? `\n\nNote: ${o.note}` : "");
}
async function sendWhatsApp(list, btn){
  if (window.VEG_DEMO) return showPdfPreview(list, false, true);
  const o = list[0], sup = S.boot.supplier || {};
  const t = btn && btn.textContent; if (btn){ btn.setAttribute("aria-busy","true"); btn.textContent = "Preparing PDF…"; }
  try {
    const blob = await makePdf(list, false);
    const file = new File([blob], pdfName(list, false), {type:"application/pdf"});
    if (navigator.canShare && navigator.canShare({files:[file]})){
      try { await navigator.share({files:[file], text:waText(o)}); }
      catch(e){ if (e && e.name !== "AbortError") throw e; }
    } else {
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
      const url = `https://wa.me/${sup.whatsapp||""}?text=${encodeURIComponent(waText(o) + "\n\n(PDF file attached)")}`;
      window.open(url, "_blank", "noopener");
      toast("File downloaded. Attach it in the WhatsApp chat.");
    }
  } catch(e){ toast("Couldn't prepare the file. Please try again."); }
  if (btn){ btn.removeAttribute("aria-busy"); btn.textContent = t; }
}

function showPdfPreview(list, combined, wa){
  const n = list.length + (combined ? 1 : 0);
  const pages = (combined ? summaryPage(list, n) : "") + list.map((o,i) => pdfPage(o, i + (combined?1:0), n)).join("");
  const m = modal(`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>Purchase order preview</h2><button class="btn sm" id="pc">Close</button></div>
    <p class="faint" style="margin:0">${wa ? "In the live app, WhatsApp opens with this file and the order text." : "In the live app, this PDF file is downloaded."}</p>
    <div id="pv" style="display:flex;flex-direction:column;gap:12px;align-items:center"></div>
    ${wa ? `<div class="card" style="white-space:pre-wrap;font-size:13px"><span class="faint">Message text</span>
${esc(waText(list[0]))}</div>` : ""}`);
  $("#pc", m).onclick = () => m.remove();
  const pv = $("#pv", m), w = Math.min(pv.clientWidth || 560, 600), sc = w / 794;
  const tmp = document.createElement("div"); tmp.innerHTML = pages;
  [...tmp.children].forEach(pg => {
    pg.style.pageBreakAfter = ""; const box = document.createElement("div");
    box.style.cssText = `width:${w}px;height:${Math.round(1123*sc)}px;overflow:hidden;border:1px solid var(--line);flex:none;position:relative;background:#fff`;
    pg.style.cssText += `;position:absolute;top:0;left:0;transform:scale(${sc});transform-origin:0 0;min-height:1123px;height:1123px`;
    box.appendChild(pg); pv.appendChild(box);
  });
}

/* ---------- smooth scroll ---------- */
if (!RM && window.Lenis){
  const lenis = new Lenis({lerp:.12, smoothWheel:true, syncTouch:false});
  (function raf(t){ lenis.raf(t); requestAnimationFrame(raf); })(performance.now());
}
boot();
</script>
